name: Build VIRA APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and save files in repo
        run: |
          unzip -q -o VIRA_NOW_APP_0611.zip -x ".github/*"
          rm VIRA_NOW_APP_0611.zip
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -m "Add VIRA files"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -mindepth 3 -maxdepth 3 -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1)"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.blackcreator.ir
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Capacitor Android
        working-directory: frontend
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
      - name: Build APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VIRA-debug-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
